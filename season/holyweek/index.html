  var wn=document.getElementById("wheel-now");if(wn)wn.textContent="本季 · "+info.season;
  var yrows=document.querySelectorAll("[data-year]");
  for(var j=0;j<yrows.length;j++){if(yrows[j].getAttribute("data-year")===info.cycle){yrows[j].classList.add("cur");var tg2=document.createElement("span");tg2.className="tag";tg2.textContent="本年";yrows[j].querySelector(".t").appendChild(tg2);}}
  var heroEl=document.getElementById("hero");
  if(heroEl){
    var au=document.getElementById("home-audio");
    var heroIdx=-1, heroDefault=-1;
    var queue=[], qpos=-1, curSlug=null;
    function fmtSun(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
    function findDefault(){
      var sunStr=fmtSun(info.sunday), idx=-1, exact=false;
      for(var i=0;i<SUNDAYS.length;i++){if(SUNDAYS[i].sunday===sunStr){idx=i;exact=true;break;}}
      if(idx<0){for(var i=SUNDAYS.length-1;i>=0;i--){if(SUNDAYS[i].sunday<sunStr){idx=i;break;}}}
      if(idx<0){idx=0;}
      return {idx:idx, label: exact?"本主日":(SUNDAYS[idx].sunday<sunStr?"最近的主日":"即將發表")};
    }
    function rowHtml(s){
      return '<button type="button" class="hrow" data-play data-slug="'+s.slug+'"><span class="tri">▶</span><span class="ht"><span class="hn">《'+s.title+'》</span><span class="hs">'+s.scripture+'</span></span><span class="hd">'+s.dur+'</span><span class="ps"></span></button>';
    }
    function setPlaying(slug){
      var rows=document.querySelectorAll("[data-play]");
      for(var i=0;i<rows.length;i++){
        var on=rows[i].getAttribute("data-slug")===slug;
        rows[i].classList.toggle("playing",!!on);
        var ps=rows[i].querySelector(".ps");
        if(ps)ps.textContent=on?"播放中":"";
      }
    }
    function stopAll(){if(au)au.pause();queue=[];qpos=-1;curSlug=null;setPlaying(null);}
    function startPlay(slug,keepQueue){
      if(!keepQueue){queue=[];qpos=-1;}
      if(curSlug===slug){
        if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){});setPlaying(slug);}
        else{au.pause();setPlaying(null);curSlug=null;queue=[];qpos=-1;}
        return;
      }
      curSlug=slug;
      au.src="media/"+slug+"/audio.mp3";
      var p2=au.play();
      if(p2&&p2.catch)p2.catch(function(){});
      setPlaying(slug);
    }
    function showSunday(i,label){
      stopAll();
      heroIdx=i;
      var S=SUNDAYS[i];
      var lb=document.getElementById("hero-label");
      lb.textContent=label||"";
      lb.style.display=label?"":"none";
      document.getElementById("hero-name").textContent=S.title;
      document.getElementById("hero-readings").textContent=S.readings;
      var rows="";
      for(var k=0;k<S.songs.length;k++)rows+=rowHtml(S.songs[k]);
      document.getElementById("hero-rows").innerHTML=rows;
      document.getElementById("hero-playall").textContent=(i===heroDefault)?"▶ 播放本主日":"▶ 播放這主日";
      document.getElementById("hero-prev").disabled=(i<=0);
      document.getElementById("hero-next").disabled=(i>=SUNDAYS.length-1);
      document.getElementById("hero-back").style.display=(i===heroDefault)?"none":"";
    }
    document.addEventListener("click",function(ev){
      var t=ev.target.closest?ev.target.closest("[data-play]"):null;
      if(t){startPlay(t.getAttribute("data-slug"),false);}
    });
    document.getElementById("hero-playall").addEventListener("click",function(){
      var list=SUNDAYS[heroIdx].songs.map(function(s){return s.slug;});
      if(!list.length)return;
      if(queue.length&&list.indexOf(curSlug)>=0){
        if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){});setPlaying(curSlug);}
        else{au.pause();setPlaying(null);curSlug=null;queue=[];qpos=-1;}
        return;
      }
      queue=list;qpos=0;
      startPlay(list[0],true);
    });
    document.getElementById("hero-prev").addEventListener("click",function(){if(heroIdx>0)showSunday(heroIdx-1,"");});
    document.getElementById("hero-next").addEventListener("click",function(){if(heroIdx<SUNDAYS.length-1)showSunday(heroIdx+1,"");});
    document.getElementById("hero-back").addEventListener("click",function(){var d=findDefault();showSunday(d.idx,d.label);});
    if(au){au.addEventListener("ended",function(){
      if(queue.length&&qpos>=0&&qpos+1<queue.length){qpos++;startPlay(queue[qpos],true);}
      else{queue=[];qpos=-1;curSlug=null;setPlaying(null);}
    });}
    var _d=findDefault();
    heroDefault=_d.idx;
    showSunday(_d.idx,_d.label);
  }
})();
</script>
</body></html>
