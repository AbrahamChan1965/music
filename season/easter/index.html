</head><body><header><div class="brand">陳曉東<span class="gold">｜</span>聖言音匠工作室<small>MUSIC.WORDNSPIRIT.COM</small></div></header><main><div class="season-head"><div class="en">EASTER</div><h1>復活期</h1><p class="nt">基督復活了。這大喜樂的日子以升天節為高峰標記：祂被接上升，坐在父的右邊。</p></div><h2 class="sec">本季的歌</h2><p class="empty">這一季的作品將陸續發表。</p><a class="back" href="../../">← 回首頁</a></main><footer><div class="fb">陳曉東｜聖言音匠工作室</div>聖言靈禱 <a href="https://devotions.wordnspirit.com" target="_blank" rel="noopener">devotions.wordnspirit.com ↗</a></footer>
<script>
var SONGS = [{"slug": "think-on-these-things", "title": "思念這些事", "sunday": "2026-10-11", "scripture": "腓立比書 4:8-9"}];
var SEASON_ZH = {"advent": "將臨期", "christmas": "聖誕期", "epiphany": "主顯期", "lent": "四旬期", "holyweek": "聖週", "easter": "復活期", "waiting": "聖靈待降期", "pentecost": "聖靈降臨節", "pentecost-season": "聖靈降臨期"};
function _D(y,m,d){return new Date(y,m-1,d);}
function _add(dt,n){var x=new Date(dt.getTime());x.setDate(x.getDate()+n);return x;}
function _easter(Y){var a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return _D(Y,mo,da);}
function _advent1(Y){var x=_D(Y,12,25);var back=(x.getDay())%7;var adv4=_add(x,-(back===0?7:back));return _add(adv4,-21);}
var CN="一二三四五六七八九";
function _cnum(n){if(n<10)return CN.charAt(n-1);if(n===10)return "十";if(n<20)return "十"+CN.charAt(n-11);var t=Math.floor(n/10),o=n%10;return CN.charAt(t-1)+"十"+(o?CN.charAt(o-1):"");}
function _sundayOfWeek(d){var dow=(d.getDay()+6)%7;return _add(d,6-dow);}
function calInfo(input){
  var d=_D(input.getFullYear(),input.getMonth()+1,input.getDate());
  var S = d>=_advent1(d.getFullYear()) ? d.getFullYear() : d.getFullYear()-1;
  var cyc = ["A","B","C"][((S%3)+3)%3];
  var yr=S+1, christmas=_D(S,12,25), epiphany=_D(yr,1,6);
  var eas=_easter(yr), ash=_add(eas,-46), palm=_add(eas,-7), asc=_add(eas,39), pent=_add(eas,49), tri=_add(eas,56);
  var key;
  if(d<christmas)key="advent";
  else if(d<=epiphany)key="christmas";
  else if(d<ash)key="epiphany";
  else if(d<palm)key="lent";
  else if(d<eas)key="holyweek";
  else if(d<=asc)key="easter";
  else if(d<pent)key="waiting";
  else if(d.getTime()===pent.getTime())key="pentecost";
  else key="pentecost-season";
  var sun=_sundayOfWeek(d), extra="";
  function wk(from){return Math.round((sun-from)/86400000/7)+1;}
  if(key==="pentecost-season"){var advN=_advent1(S+1);
    if(sun>=advN){extra="基督君王主日";sun=_add(advN,-7);}
    else if(sun>=tri){var n=wk(tri);extra=n===1?"三一主日":("三一後第"+_cnum(n)+"主日");}}
  else if(key==="advent"){extra="將臨期第"+_cnum(wk(_advent1(S)))+"主日";}
  else if(key==="lent"){var fs=_add(ash,4);if(sun>=fs){var n2=wk(fs);if(n2>=1&&n2<=5)extra="四旬期第"+_cnum(n2)+"主日";}}
  else if(key==="easter"){extra="復活期第"+_cnum(wk(eas))+"主日";}
  else if(key==="epiphany"){var bs=_add(epiphany,((7-epiphany.getDay())%7)||7);if(sun>=bs)extra="主顯後第"+_cnum(wk(bs))+"主日";}
  var YEAR_ZH={A:"馬太年",B:"馬可年",C:"路加年"};
  var coords=[YEAR_ZH[cyc],SEASON_ZH[key]];if(extra)coords.push(extra);
  coords.push("主日 "+sun.getFullYear()+"/"+String(sun.getMonth()+1).padStart(2,"0")+"/"+String(sun.getDate()).padStart(2,"0"));
  return {key:key,cycle:cyc,season:SEASON_ZH[key],coords:coords.join(" · "),sunday:sun};
}
window.__cal=function(iso){var p=iso.split("-");return calInfo(_D(+p[0],+p[1],+p[2]));};
(function(){
  var info=calInfo(new Date());
  var ns=document.getElementById("now-season"),nc=document.getElementById("now-coords");
  if(ns)ns.textContent=info.season;
  if(nc)nc.textContent=info.coords;
  var rows=document.querySelectorAll("[data-season]");
  for(var i=0;i<rows.length;i++){if(rows[i].getAttribute("data-season")===info.key){rows[i].classList.add("cur");var tt=rows[i].querySelector(".t");if(tt){var tg=document.createElement("span");tg.className="tag";tg.textContent="本季";tt.appendChild(tg);}}}
  var wn=document.getElementById("wheel-now");if(wn)wn.textContent="本季 · "+info.season;
  var yrows=document.querySelectorAll("[data-year]");
  for(var j=0;j<yrows.length;j++){if(yrows[j].getAttribute("data-year")===info.cycle){yrows[j].classList.add("cur");var tg2=document.createElement("span");tg2.className="tag";tg2.textContent="本年";yrows[j].querySelector(".t").appendChild(tg2);}}
  var box=document.getElementById("now-song");
  if(box&&SONGS.length){
    var sunStr=info.sunday.getFullYear()+"-"+String(info.sunday.getMonth()+1).padStart(2,"0")+"-"+String(info.sunday.getDate()).padStart(2,"0");
    var pick=null,label="";
    for(var k=0;k<SONGS.length;k++){if(SONGS[k].sunday<=sunStr){pick=SONGS[k];label=SONGS[k].sunday===sunStr?"本週的歌":"最近的一首";}}
    if(!pick){pick=SONGS[0];label="即將發表";}
    box.innerHTML='<a class="songlink" href="'+pick.slug+'/"><span class="sl">'+label+'</span><span class="st">《'+pick.title+'》</span></a><div class="cd">'+pick.scripture+'</div>';
  }
})();
</script>
